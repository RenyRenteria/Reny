name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify FFmpeg dependency
        run: ffmpeg -version

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          touch database/database.sqlite

      - name: Run tests
        run: composer test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare isolated browser database
        env:
          RENY_QA_PASSWORD: Browser-only-fixture-password-2026
        run: |
          php artisan migrate --force
          php artisan db:seed --class=QaAccountStateSeeder --force
          php artisan db:seed --class=QaMerchProductSeeder --force

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify public website in desktop and mobile browsers
        env:
          APP_URL: http://127.0.0.1:8000
          SESSION_DRIVER: file
          CACHE_STORE: file
          YOYCOL_ENABLED: 'true'
          YOYCOL_SALES_ENABLED: 'true'
          RENY_QA_PASSWORD: Browser-only-fixture-password-2026
        run: npm run test:browser

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-website-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
